    statement: |
      For every integer d >= 1 and every pair of real symmetric positive
      semidefinite matrices A,B in R^{d x d}, the following are equivalent:
        (AB)^T = AB;
        AB = BA;
        (AB)^T = AB and x^T ABx >= 0 for every x in R^d.
