self_critique:
  plausibility_issues:
    - |
      STATUS: the original universal target is false, not an unresolved
      intermediate lemma. In dimension d=2, take
        A_0 = [[1,0],[0,0]], B_0 = [[1,1],[1,1]], x_0 = (-1,2)^T.
      Both factors equal their transposes. For every (u,v) in R^2,
        (u,v) A_0 (u,v)^T = u^2 >= 0,
        (u,v) B_0 (u,v)^T = (u+v)^2 >= 0.
      Nevertheless,
        A_0 B_0 = [[1,1],[0,0]],
        (A_0 B_0)_{12} - (A_0 B_0)_{21} = 1,
        x_0^T A_0 B_0 x_0 = -1 < 0.
      Thus the first conjunct of GOAL fails under its exact hypotheses.
    - |
      COMPLETENESS CHECK: no sound dependency chain from true literature
      results and true intermediate claims can establish this GOAL. Empty
      steps, target.inputs, proof_order, and key_steps explicitly record
      that no proof decomposition is supplied. This file must not be
      interpreted as a proof or a plan proving the requested assertion.
