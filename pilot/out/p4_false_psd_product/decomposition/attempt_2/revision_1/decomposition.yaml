      The two-dimensional example was recomputed independently using exact
      rational arithmetic. It confirms the specific facts independently
      verified in Phase 4f and recorded in plan_history.md; no factual
      finding from that history is disputed.
    - |
      S1 agrees with the obstruction: A_0 B_0 - B_0 A_0 = [[0,1],[-1,0]]
