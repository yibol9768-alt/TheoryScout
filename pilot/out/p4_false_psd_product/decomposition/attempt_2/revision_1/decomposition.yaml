    - |
      The eigenvalues of A_0 B_0 are 1 and 0. Their nonnegativity does not
      imply symmetry or quadratic-form nonnegativity, as the displayed
      off-diagonal difference and value -1 demonstrate. Establishing the
      second conjunct alone cannot establish the original conjunction.
