      where r=(L-mu)/L>0, so the initial unit eigenvector has exact
      error r^k. For q=(L-mu)/(L+mu)>0, the difference
      r-q=mu(L-mu)/(L(L+mu)) is strictly positive. Thus r^k>q^k for
      every integer k>=1. This is an attained violation, not an inference
