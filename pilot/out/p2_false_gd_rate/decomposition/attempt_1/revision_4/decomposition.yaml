      differentiating the symmetric quadratic gives Hx-b. Subtraction of
      Hx^star=b gives the stated recurrence for every real eta and k>=0.
      At eta=1/L, the symmetric update has eigenvalues in [0,1-mu/L],
      which yields precisely the rate in STEP1, including k=0.
    - >-
