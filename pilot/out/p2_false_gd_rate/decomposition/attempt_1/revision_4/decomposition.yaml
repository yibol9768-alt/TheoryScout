sources:
  - id: S1
    type: literature
    statement: |
      Let f be in C^2(R^d), with mu I <= Hessian f(x) <= L I for every x,
      where the inequalities are in the positive-semidefinite order and
      0 < mu < L. For eta in R, define
      T_eta(x) = x - eta grad f(x) and
      rho(eta) = max{|1 - eta mu|, |1 - eta L|}.
      For every x,y in R^d,
      ||T_eta(x) - T_eta(y)||_2 <= rho(eta) ||x-y||_2.
      If 0 < eta < 2/L, then, for the unique minimizer x^star and every
      x_0 in R^d, the iteration x_{k+1} = T_eta(x_k) satisfies
      ||x_k-x^star||_2 <= rho(eta)^k ||x_0-x^star||_2
      for every integer k >= 0. The minimum of rho(eta) over eta in R is
      (L-mu)/(L+mu), attained at eta = 2/(L+mu).
    citation: |
      <cite>type=theorem; label=S1; title=A Primer on Monotone Operator Methods; authors=Ernest K. Ryu and Stephen Boyd; source_url=https://web.stanford.edu/~boyd/papers/pdf/monotone_primer.pdf; verifier_locator=Section 5.1, Gradient method, printed page 15 (PDF page 13), sentence immediately after the assumption of strong convexity and strong smoothness; statement_match=exact; statement=Then I − α∇f is Lipschitz with parameter LGM = max{|1 − αm|, |1 − αL|}.; usage=Confirms the contraction factor derived directly above for this quadratic, with m=mu and alpha=eta; at eta=1/L this factor is 1-mu/L.</cite>

steps:
  - id: STEP1
    statement: |
      For every integer d >= 1, every real symmetric H with spectrum in
      [mu,L], every b,x_0 in R^d, and 0 < mu < L, the quadratic in GOAL has
      grad f(x) = Hx-b and unique minimizer x^star = H^{-1}b.
      For every real constant eta and every integer k >= 0, its gradient
      descent iterates satisfy
      x_k-x^star = (I-eta H)^k (x_0-x^star).
      In particular, at the prescribed eta = 1/L, for every integer k >= 0,
      ||x_k-x^star||_2 <= (1-mu/L)^k ||x_0-x^star||_2.
    inputs: [S1]
    difficulty: easy
    is_key_step: false
    rationale: |
      The exact recurrence permits an equality example rather than relying
      on an upper bound to disprove a stronger proposed upper bound.
      The valid uniform estimate also records what the prescribed step
      actually guarantees.
    strategy_hint: |
      Differentiate the symmetric quadratic, use H x^star = b, and subtract
      x^star from one update. Iterate the resulting linear recurrence.
      Apply S1 with eta = 1/L, for which rho(eta) = 1-mu/L.

  - id: STEP2
    statement: |
      For every pair 0 < mu < L, set d=2, H=diag(mu,L), b=(0,0)^top,
      x_0=(1,0)^top, and eta=1/L. Then H=H^top,
      lambda_min(H)=mu, lambda_max(H)=L, x^star=(0,0)^top, and
      x_k=((1-mu/L)^k,0)^top for every integer k >= 0.
      Put r=(L-mu)/L and q=(L-mu)/(L+mu). Then
      r-q = mu(L-mu)/(L(L+mu)) > 0, and for every integer k >= 1,
      ||x_k-x^star||_2 = r^k > q^k ||x_0-x^star||_2.
      In particular, mu=1, L=2, and k=1 give
      ||x_1-x^star||_2 = 1/2 > 1/3 = q ||x_0-x^star||_2.
    inputs: [STEP1]
    difficulty: easy
    is_key_step: false
    rationale: |
      This is an admissible counterexample to GOAL, even when both spectral
      endpoints must be attained. It also proves sharpness of the factor
      1-mu/L in STEP1. A universal inequality cannot hold when it fails for
      this particular H, initial point, and k=1.
    strategy_hint: |
      Here I-H/L=diag(1-mu/L,0). Apply its powers to (1,0)^top and compare
      the positive factors r and q using the displayed exact difference.
      The resulting statement is the negation of GOAL, not a lemma proving it.

  - id: STEP3
    statement: |
      For every integer d >= 1, every real symmetric H with spectrum in
      [mu,L], every b,x_0 in R^d, and 0 < mu < L, let y_0=x_0 and
      y_{k+1}=y_k-(2/(L+mu))(Hy_k-b).
      Then for every integer k >= 0,
      ||y_k-H^{-1}b||_2 <= ((L-mu)/(L+mu))^k ||y_0-H^{-1}b||_2.
      For d=2, H=diag(mu,L), b=(0,0)^top, and y_0=(1,0)^top,
      equality holds for every integer k >= 0.
    inputs: [S1, STEP1]
    difficulty: easy
    is_key_step: false
    rationale: |
      This states the valid alternative with the requested factor and a
      changed step. It is a correction for reference, not a consequence
      establishing GOAL with its original algorithm.
    strategy_hint: |
      Substitute eta=2/(L+mu) into S1. The two endpoint multipliers are
      q and -q, where q=(L-mu)/(L+mu). For the equality example use the
      exact recurrence from STEP1 along the mu eigenvector.

